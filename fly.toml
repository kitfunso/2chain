app = "twochain-registry"
primary_region = "fra"

[build]

[env]
  STORAGE_DRIVER = "sqlite"
  EMBEDDER = "ollama"
  TWOCHAIN_DB_PATH = "/data/db.sqlite"
  OLLAMA_MODELS = "/data/ollama"
  HOST = "0.0.0.0"
  PORT = "8080"

[mounts]
  source = "twochain_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
