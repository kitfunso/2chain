name: v2 install smoke (cross-OS)

# Phase 1 plan Step 11.5: gate the merge on `npm install` succeeding without
# native build tools on Windows x64, macOS arm64, and Linux x64. CLAUDE.md
# rule 10: better-sqlite3 + sqlite-vec must ship prebuilt binaries.

on:
  push:
    branches: [master, main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v2-install-smoke.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/storage/**'
      - 'src/embeddings/**'
      - '.github/workflows/v2-install-smoke.yml'
  workflow_dispatch: {}

jobs:
  install:
    name: ${{ matrix.os }} npm install + native deps
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm install (no audit, no fund)
        run: npm install --no-audit --no-fund

      - name: Verify better-sqlite3 + sqlite-vec load
        # Imports both natives, opens an in-memory DB, loads sqlite-vec, creates
        # a vec0 virtual table, runs a tiny vector query. If any prebuilt
        # binary is missing this fails with a meaningful error.
        run: node -e "const Database = require('better-sqlite3'); const sv = require('sqlite-vec'); const db = new Database(':memory:'); sv.load(db); db.exec('CREATE VIRTUAL TABLE t USING vec0(e float[768] distance_metric=cosine)'); console.log('sqlite-vec', db.prepare('SELECT vec_version() AS v').get()); db.close();"

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit + integration tests (no Ollama, skips Ollama-only suites)
        run: npm test
        env:
          OLLAMA_HOST: http://127.0.0.1:99999  # unreachable on purpose so suites with `skip` skip cleanly

      - name: lint:no-mongodb (CLAUDE.md rule 1+3)
        run: npm run lint:no-mongodb
